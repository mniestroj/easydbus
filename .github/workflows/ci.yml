name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.1.5"
          - "5.3.6"
          - "5.4.7"
          - "5.5.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libglib2.0-dev libreadline-dev

      - name: Build and install Lua ${{ matrix.lua }}
        run: |
          curl -sSfL "https://www.lua.org/ftp/lua-${{ matrix.lua }}.tar.gz" | tar xz
          cd "lua-${{ matrix.lua }}"
          make linux MYCFLAGS=-fPIC
          sudo make install

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Install
        run: sudo cmake --install build --prefix /usr/local

      - name: Load module under Lua
        run: lua -e "require('easydbus'); print('easydbus loaded under Lua ' .. _VERSION)"
