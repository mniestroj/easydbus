name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.1.5"
          - "5.3.6"
          - "5.4.7"
          - "5.5.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3-pip \
            libglib2.0-dev libreadline-dev dbus

      - name: Install up-to-date CMake
        run: sudo pip3 install --break-system-packages cmake

      - name: Build and install Lua ${{ matrix.lua }}
        run: |
          curl -sSfL "https://www.lua.org/ftp/lua-${{ matrix.lua }}.tar.gz" | tar xz
          cd "lua-${{ matrix.lua }}"
          make linux MYCFLAGS=-fPIC
          sudo make install

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Install
        run: sudo cmake --install build --prefix /usr/local

      - name: Load module under Lua
        run: lua -e "require('easydbus'); print('easydbus loaded under Lua ' .. _VERSION)"

      - name: Build and install LuaRocks
        run: |
          curl -sSfL https://luarocks.org/releases/luarocks-3.13.0.tar.gz | tar xz
          cd luarocks-3.13.0
          LUA_MM=$(echo "${{ matrix.lua }}" | cut -d. -f1,2)
          ./configure --with-lua=/usr/local --lua-version="$LUA_MM"
          make
          sudo make install

      - name: Install busted
        run: sudo luarocks install busted

      - name: Run spec tests
        run: dbus-run-session -- busted spec/
